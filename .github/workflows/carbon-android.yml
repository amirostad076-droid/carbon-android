name: Build CARBON Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'carbon_android/**'
      - '.github/workflows/carbon-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carbon_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-android-debug
          path: |
            carbon_android/app/build/outputs/apk/debug/*.apk
            carbon_android/app/build/outputs/bundle/debug/*.aab
